const map=L.map('map',{zoomControl:false}).setView([55.605,13.0038],12);
setTimeout(()=>map.invalidateSize(),300);
window.addEventListener('load',()=>{
  setTimeout(()=>map.invalidateSize(true),1000);
});

L.control.zoom({position:'bottomright'}).addTo(map);
L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap-bidragsgivare'}).addTo(map);
const cluster=L.markerClusterGroup({chunkedLoading:true,showCoverageOnHover:false,maxClusterRadius:45,disableClusteringAtZoom:18});
const markers=[]; const byType=new Map();
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function popup(p){
  const osm=`https://www.openstreetmap.org/?mlat=${p.lat}&mlon=${p.lon}#map=19/${p.lat}/${p.lon}`;
  const google=`https://www.google.com/maps/dir/?api=1&destination=${p.lat},${p.lon}`;
  const status=p.status||'Ej angiven';
  const priority=p.prioritet||'Ej angiven';

  return `
    <div class="popup-title">${esc(p.typ || 'Papperskorg')}</div>
    <div class="popup-grid">
      <b>Status</b><span>${esc(status)}</span>
      <b>Prioritet</b><span>${esc(priority)}</span>
      <b>gid</b><span>${esc(p.gid)}</span>
      <b>Latitud</b><span>${p.lat}</span>
      <b>Longitud</b><span>${p.lon}</span>
    </div>

<select>
<br><br>
  <option>Ej tömd</option>
  <option>Sönder</option>
  <option>Lås sönder</option>
  <option>Klotter</option>
  <option>Affischerad</option>
  <option>Klistermärke</option>
  <option>Smutsig</option>
  <option>Saknas</option>
</select>
<br><br>
<button>💾 Spara status</button>

    <div class="popup-actions">
      <a href="${google}" target="_blank">Navigera</a>
      <a href="${osm}" target="_blank">Öppna karta</a>
    </div>
  `;
}
for(const f of data.features){
 const p=f.properties; const [lon,lat]=f.geometry.coordinates;
 const icon=L.divIcon({className:'',html:'<div class="dot"></div>',iconSize:[17,17],iconAnchor:[8,8]});
 const m=L.marker([lat,lon],{icon,title:`${p.typ} ${p.gid}`}).bindPopup(popup(p)); m.feature=f; markers.push(m); cluster.addLayer(m);
 if(p.typ) byType.set(p.typ,(byType.get(p.typ)||0)+1);
}
map.addLayer(cluster);
if(markers.length) map.setView([55.605,13.0038],12);
const typeFilter=document.getElementById('typeFilter');
[...byType.entries()].sort((a,b)=>a[0].localeCompare(b[0],'sv')).forEach(([t,n])=>{const o=document.createElement('option');o.value=t;o.textContent=`${t} (${n})`;typeFilter.appendChild(o);});
const status=document.getElementById('status'); status.textContent=`Visar ${markers.length.toLocaleString('sv-SE')} papperskorgar. Klicka på en punkt för detaljer.`;
function applyFilter(zoomFirst=false){
 const q=document.getElementById('search').value.trim().toLowerCase(); const t=typeFilter.value; cluster.clearLayers();
 const found=markers.filter(m=>{const p=m.feature.properties; return (!t||p.typ===t)&&(!q||p.typ.toLowerCase().includes(q)||p.gid.toLowerCase().includes(q));});
 found.forEach(m=>cluster.addLayer(m)); status.textContent=`Visar ${found.length.toLocaleString('sv-SE')} av ${markers.length.toLocaleString('sv-SE')}.`;
 if(found.length===1){map.setView(found[0].getLatLng(),18);found[0].openPopup();}
 else if(found.length) map.fitBounds(cluster.getBounds(),{padding:[30,30],maxZoom:16});
}
document.getElementById('searchBtn').addEventListener('click',()=>applyFilter(true));
document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')applyFilter(true);});
typeFilter.addEventListener('change',()=>applyFilter(false));
document.getElementById('resetBtn').addEventListener('click',()=>{document.getElementById('search').value='';typeFilter.value='';applyFilter();});
document.getElementById('locateBtn').addEventListener('click',()=>{if(!navigator.geolocation){status.textContent='Platstjänster stöds inte i denna webbläsare.';return;} status.textContent='Hämtar din position…';navigator.geolocation.getCurrentPosition(pos=>{const ll=[pos.coords.latitude,pos.coords.longitude];L.circleMarker(ll,{radius:8,color:'#7c3aed',fillColor:'#a78bfa',fillOpacity:.9}).addTo(map).bindPopup('Din position').openPopup();map.setView(ll,16);status.textContent=`Din position visas. Noggrannhet cirka ${Math.round(pos.coords.accuracy)} m.`;},()=>status.textContent='Kunde inte hämta positionen. Tillåt platstjänster för webbläsaren.',{enableHighAccuracy:true,timeout:10000});});
